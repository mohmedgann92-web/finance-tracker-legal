<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Tracker: privacy and support</title>
<style>:root{color-scheme:light dark;--bg:#F6F8FB;--fg:#22272B;--muted:#5E6873;--line:#D9E0E7;--accent:#A96A2C}
@media (prefers-color-scheme:dark){:root{--bg:#24282C;--fg:#ECEFF2;--muted:#B8C0C8;--line:#434A50;--accent:#C98546}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 64px}
main{max-width:720px;margin:0 auto}
header{padding:28px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
h1{font-size:1.8rem;line-height:1.2;margin:0 0 6px}
h2{font-size:1.15rem;margin:2rem 0 .5rem}
p,li{max-width:68ch}
li{margin:.35rem 0}
a{color:var(--accent)}
nav.lang{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.92rem}
nav.lang b{color:var(--muted)}
footer{margin-top:3rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:1rem}
.cards{display:grid;gap:12px;margin-top:1.5rem}
.card{display:block;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--fg)}
.card strong{display:block;color:var(--accent);margin-bottom:2px}</style>
</head>
<body>
<main>
<header><h1>Finance Tracker</h1><p>Privacy policy and support pages.</p></header>
<div class="cards"><a class="card" href="privacy/"><strong>Privacy policy</strong>سياسة الخصوصية · Gizlilik politikası</a><a class="card" href="support/"><strong>Help and support</strong>المساعدة والدعم · Yardım ve destek</a></div>
</main>
</body>
</html>
